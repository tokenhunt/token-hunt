name: sarif
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install .
      # scan reads a single file or stdin, so feed the tracked text files as
      # one stream (binary/exotic files excluded by pathspec — read_text-safe).
      # tests/ excluded: fixture secrets are deliberate fakes. scripts/vendor/
      # and src/token_hunt/patterns/ excluded: rule definitions contain provider
      # keywords beside regex text, so they self-match by construction.
      - name: Run token-hunt (SARIF)
        run: >
          git ls-files -z '*.py' '*.md' '*.toml' '*.yaml' '*.yml' '*.txt' '*.cfg' '*.ini'
          ':(exclude)tests/*' ':(exclude)scripts/vendor/*' ':(exclude)src/token_hunt/patterns/*'
          | xargs -0 cat
          | token-hunt scan --stdin --context CIRepoScan --format sarif --no-log
          > token-hunt.sarif
      # github/codeql-action v3, pinned to commit 74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6
      # (resolved from the v3 tag on 2026-11-27)
      - uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3
        # fork pull_request events don't carry security-events: write —
        # gate the upload instead of failing PR checks
        if: github.event_name != 'pull_request'
        with:
          sarif_file: token-hunt.sarif
