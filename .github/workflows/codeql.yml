name: CodeQL

# Source-level security analysis (interpreted languages, no build step).
# security-extended queries. Findings land under Security -> Code scanning.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 8 * * 1' # Mondays 08:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076a  # v4
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076a  # v4
        with:
          category: "/language:python"
