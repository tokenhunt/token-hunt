name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # PyPI Trusted Publishing (OIDC) — no API token secret

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v2
        with:
          generate_release_notes: true
          files: dist/*
      # Publishes via PyPI Trusted Publishing — the pending publisher on PyPI
      # must match: owner tokenhunt, repo token-hunt, workflow release.yml,
      # no environment. Version re-uploads are rejected by PyPI, so each
      # tag must bump the version first.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
