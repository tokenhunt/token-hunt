name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "23 19 * * 6"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Run scorecard
        # ossf/scorecard-action v2 (v2.6.0), pinned to commit 23f22cd43608bae7a1f1fa2603d7314dee9538a5
        # (resolved from the latest release tag on 2026-11-27)
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        # actions/upload-artifact v4 (v4.6.2), pinned to commit ea165f8d65b6e75b540449e92b4886f43607fa02
        # (resolved from the latest v4 tag on 2026-11-27)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: OpenSSF Scorecard
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        # github/codeql-action v3, pinned to commit 74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6
        # (resolved from the v3 tag on 2026-11-27)
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3
        with:
          sarif_file: results.sarif
