# FP tightening carried by the converter (benign-corpus batch-2 pass):
# dots excluded from the value charset (dotted env-var references like
# process.env.X never match), value minimum raised 10 -> 25, and
# secret_group=1 set so the entropy gate applies to the captured value,
# not the keyword-laden whole match
[[rules]]
id = "gitleaks-generic-api-key"
description = 'Detected a Generic API Key, potentially exposing access to various services and sensitive operations.'
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w=-]{25,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3.5
keywords = ["access", "api", "auth", "key", "credential", "creds", "passwd", "password", "secret", "token"]
secret_group = 1

